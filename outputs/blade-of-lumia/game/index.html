<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blade of Lumia</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <!-- ── HUD ── -->
  <div id="hud">
    <div id="hud-left">
      <div id="hud-hearts"></div>
      <div id="hud-stage-label"></div>
    </div>
    <div id="hud-center">
      <div id="hud-dungeon-info" class="hidden">
        <span id="hud-dungeon-name"></span>
        <span id="hud-dungeon-items"></span>
      </div>
      <!-- 選択中の目的地マーク（キュー16）＝方向（8方向の矢印）と距離（画面数）。
           マークを選んでいないときは出さない＝画面を狭くしない。 -->
      <div id="hud-mark-guide" class="hidden">
        <span id="hud-mark-dot"></span>
        <span id="hud-mark-label"></span>
        <span id="hud-mark-arrow"></span>
        <span id="hud-mark-dist"></span>
      </div>
    </div>
    <div id="hud-right">
      <div id="hud-equip">
        <!-- data-icon＝shared/ui-icons.js が起動時に絵（canvas）へ差し替える。
             中の絵文字は「絵が引けなかった時の保険」で残している（10e）。
             大きさは CSS 変数 --hud-icon（game/css/hud.css）＝文字と同じ単位で伸縮する（10e-2）。 -->
        <span id="hud-equip-sword" class="equip-slot" title="剣" data-icon="sword" data-icon-px="var(--hud-icon)">⚔</span>
        <span id="hud-equip-shield" class="equip-slot" title="たて" data-icon="shield" data-icon-px="var(--hud-icon)">🛡</span>
        <span id="hud-equip-armor" class="equip-slot" title="防具" data-icon="armor" data-icon-px="var(--hud-icon)">⚚</span>
      </div>
      <div id="hud-sub-item">
        <span id="hud-sub-label">SUB:</span>
        <span id="hud-sub-icon">—</span>
        <span id="hud-sub-count"></span>
      </div>
      <div id="hud-wallet"><span data-icon="rupee" data-icon-px="var(--hud-icon)">💰</span><span id="hud-rupees">0</span>　<span data-icon="triforce" data-icon-px="var(--hud-icon)">◭</span><span id="hud-triforce">0</span></div>
    </div>
  </div>

  <!-- ── ボス HP バー ── -->
  <div id="boss-hpbar" class="hidden">
    <span id="boss-name">ボス</span>
    <div id="boss-hp-track">
      <div id="boss-hp-fill"></div>
    </div>
  </div>

  <!-- ── ゲームボード ── -->
  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <!-- ── メッセージ ── -->
  <div id="msg-bar" class="hidden"></div>

  <!-- ── NPC 会話ダイアログ ── -->
  <div id="dialog-overlay" class="hidden">
    <div id="dialog-box">
      <div id="dialog-name"></div>
      <div id="dialog-text"></div>
      <div id="dialog-next">▼ 次へ（Spaceキー）</div>
    </div>
  </div>

  <!-- ── ポーズ画面 ── -->
  <div id="pause-overlay" class="hidden">
    <div id="pause-box">
      <div id="pause-title">⏸ PAUSED</div>
      <div id="pause-items"></div>
      <div id="pause-hint">← → でアイテム　Escape で決定・再開</div>
      <div id="pause-stats"></div>
      <!-- 地図（その層の地図を入手済みのときのみ表示）
           ダンジョン＝部屋グリッド／field＝1セル1px の見取り図（キュー15）。
           見出しの文字は層によって変わる∴文字だけ別の span に分ける（絵は起動時に
           canvas へ差し替わる＝textContent で上書きすると絵が消える）。 -->
      <div id="pause-dungeon-map" class="hidden">
        <div id="pause-map-title"><span data-icon="map" data-icon-px="18">🗺</span> <span id="pause-map-label">ダンジョンマップ</span></div>
        <!-- 地図とマーク一覧を横並びにする（キュー16）＝一覧を下に置くと枠の高さが
             伸びて窓に収まらなくなる（地図だけで既に約650px）。 -->
        <div id="pause-map-body">
          <div id="pause-map-wrap">
            <canvas id="pause-map-canvas"></canvas>
            <!-- 現在地（field の見取り図用）＝白枠＋点滅。塗り潰しにしないのは
                 画面の中身が絵で埋まっていて塗ると絵が消えるため。 -->
            <div id="pause-map-here" class="hidden"></div>
            <!-- 選択中マーク（キュー16）＝黄枠＋点滅。現在地は白枠∴色で区別できる。
                 他のマークは canvas に静止で描く（点滅するのは選択中の1つだけ）。 -->
            <div id="pause-map-marksel" class="hidden"></div>
          </div>
          <div id="pause-mark-list" class="hidden"></div>
        </div>
        <div id="pause-map-hint" class="hidden"><span data-icon="compass" data-icon-px="16">🧭</span> ボス部屋あり</div>
      </div>
    </div>
  </div>

  <!-- ── タイトル（続きから / はじめから）── -->
  <div id="title-overlay" class="hidden">
    <div id="title-box">
      <div id="title-logo"><span data-icon="sword" data-icon-px="26">⚔</span> Blade of Lumia</div>
      <div id="title-buttons">
        <button id="btn-continue" class="title-btn">続きから</button>
        <button id="btn-newgame"  class="title-btn title-btn--new">はじめから</button>
      </div>
    </div>
  </div>

  <!-- ── はじめから確認ダイアログ ── -->
  <div id="confirm-overlay" class="hidden">
    <div id="confirm-box">
      <div id="confirm-msg">ゲームの保存データは削除されます。<br>本当にはじめからでよろしいですか？</div>
      <div id="confirm-buttons">
        <button id="btn-confirm-yes" class="title-btn title-btn--danger">はい、削除して開始</button>
        <button id="btn-confirm-no"  class="title-btn">戻る</button>
      </div>
    </div>
  </div>

  <!-- ── ショップ ── -->
  <div id="shop-overlay" class="hidden">
    <div id="shop-box">
      <div id="shop-title">🏪 みせ</div>
      <div id="shop-items"></div>
      <div id="shop-result" class="hidden"></div>
      <div id="shop-wallet"><span data-icon="rupee" data-icon-px="18">💰</span> <span id="shop-rupees">0</span></div>
      <div id="shop-hint">↑↓ で選択　Space/Z で購入　Escape で閉じる</div>
    </div>
  </div>

  <!-- ── 転移の石碑の行き先（キュー27）── -->
  <div id="warp-overlay" class="hidden">
    <div id="warp-box">
      <div id="warp-title">転移の石碑</div>
      <div id="warp-sub">どの碑へ 転移する？</div>
      <div id="warp-list"></div>
      <div id="warp-hint">↑↓ で選択　Space/Z で決定　Escape でやめる</div>
    </div>
  </div>

  <!-- ── ゲームオーバー ── -->
  <div id="gameover-overlay" class="hidden">
    <div id="gameover-box">
      <div class="gameover-title">GAME OVER</div>
      <button id="gameover-retry">もう一度</button>
    </div>
  </div>

  <!-- ── エンディング ── -->
  <div id="ending-overlay" class="hidden">
    <!-- フェーズ1：スタッフロール -->
    <div id="ending-phase1">
      <div id="ending-scroll-wrap">
        <div id="ending-scroll"></div>
      </div>
    </div>
    <!-- フェーズ2：THE END シーン（姫・主人公・姫） -->
    <div id="ending-phase2" class="hidden">
      <div id="ending-happy-scene">
        <div id="ending-princess1-canvas" class="ending-big-sprite"></div>
        <div id="ending-hero-canvas"      class="ending-big-sprite"></div>
        <div id="ending-princess2-canvas" class="ending-big-sprite"></div>
      </div>
      <div id="ending-the-end">THE END</div>
      <div id="ending-msg"></div>
      <button id="ending-restart" class="title-btn">はじめから</button>
    </div>
  </div>

  <!-- ── モバイルコントローラー ── -->
  <div id="mobile-ctrl">
    <div id="dpad">
      <button class="dpad-btn" data-dir="up">▲</button>
      <div class="dpad-mid">
        <button class="dpad-btn" data-dir="left">◀</button>
        <button class="dpad-btn dpad-center" data-dir="">　</button>
        <button class="dpad-btn" data-dir="right">▶</button>
      </div>
      <button class="dpad-btn" data-dir="down">▼</button>
    </div>
    <div id="action-btns">
      <button id="btn-sub" class="action-btn">SUB</button>
      <button id="btn-sword" class="action-btn" data-icon="sword" data-icon-px="26">⚔</button>
      <button id="btn-shield" class="action-btn shield-btn" data-icon="shield" data-icon-px="26">🛡</button>
      <button id="btn-fly" class="action-btn hidden" data-icon="wingRobe" data-icon-px="26">🪽</button>
      <button id="btn-menu" class="action-btn">MENU</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
